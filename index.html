<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الحضور والتقارير - متعدد المدارس</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #eef2f3; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #007bff; margin-bottom: 5px; }
        h3 { color: #555; margin-top: 0; font-size: 16px; margin-bottom: 25px; }
        .btn-menu { display: block; width: 100%; padding: 15px; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; margin-bottom: 15px; text-align: right; box-shadow: 0 2px 5px rgba(0,0,0,0.15); text-decoration: none; }
        .btn-schools { background: #28a745; } /* أخضر لإدارة المدارس */
        .btn-attendance { background: #007bff; } /* أزرق لتسجيل الحضور */
        .external-box { margin-top: 30px; background: #e8f4fd; padding: 15px; border-radius: 8px; border: 1px solid #b8daff; text-align: center; }
        input { width: 65%; padding: 8px; font-size: 12px; direction: ltr; text-align: left; }
        .copy-btn { background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>نظام إدارة الحضور والتقارير الجغرافي</h2>
    <h3>لوحة التحكم المركزية - متعدد المدارس</h3>
    <hr style="margin: 20px 0; border:0; border-top:1px solid #eee;">

    <!-- الأزرار الرئيسية بتصميم النجدين المريح -->
    <a href="schools.html" class="btn-menu btn-schools">🏫 إدارة وإضافة المدارس (GPS والحدود)</a>
    <a href="attendance.html" class="btn-menu btn-attendance">📍 تسجيل الحضور الجغرافي للموظفين</a>

    <!-- رابط المشاركة للموظفين -->
    <div class="external-box">
        <h4 style="margin-top: 0; color: #004085;">🔗 رابط النظام للموظفين</h4>
        <p style="font-size: 12px; color: #333; margin-bottom: 10px;">انسخ الرابط وشاركه مع الكادر:</p>
        <div style="display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap;">
            <input type="text" id="externalLink" readonly>
            <button class="copy-btn" onclick="copyLink()">نسخ</button>
        </div>
    </div>
</div>

<script>
    document.getElementById('externalLink').value = window.location.href.split('?')[0];
    function copyLink() {
        let copyText = document.getElementById("externalLink");
        copyText.select();
        navigator.clipboard.writeText(copyText.value);
        alert("تم نسخ الرابط بنجاح!");
    }
</script>

</body>
</html>
