<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل دخول مدراء المدارس</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; text-align: center; }
        .btn { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #0056b3; }
        #errorMsg { color: red; margin-top: 10px; font-size: 14px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h2 style="color: #333; margin-bottom: 10px;">بوابة دخول المدارس</h2>
    <p id="instructionText" style="color: #666; font-size: 14px; margin-bottom: 20px;">أدخل كود المدرسة للتوجه إلى لوحة التحكم</p>
    
    <!-- خطوة 1: إدخال كود المدرسة -->
    <div id="stepCode">
        <input type="text" id="schoolCodeInput" placeholder="أدخل كود المدرسة (مثل: n1)">
        <button class="btn" onclick="checkSchoolCode()">التالي</button>
    </div>

    <!-- خطوة 2: إدخال كلمة المرور (تظهر حسب حالة المدرسة) -->
    <div id="stepPassword" class="hidden">
        <input type="hidden" id="verifiedSchoolCode">
        
        <!-- تظهر في المرة الأولى (إنشاء كلمة مرور + تأكيد) -->
        <div id="firstTimeFields" class="hidden">
            <p style="font-size: 13px; color: #d9534f; margin-bottom: 5px;">هذه المدرسة تسجل لأول مرة، يرجى تعيين كلمة مرور جديدة:</p>
            <input type="password" id="newPassword" placeholder="أدخل كلمة المرور">
            <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور">
            <button class="btn" style="background: #28a745;" onclick="setupAndLogin()">حفظ والدخول</button>
        </div>

        <!-- تظهر في المرات اللاحقة (كلمة المرور فقط) -->
        <div id="normalLoginFields" class="hidden">
            <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور الخاصة بالمدير">
            <button class="btn" onclick="verifyPasswordAndLogin()">تسجيل الدخول</button>
        </div>
    </div>

    <div id="errorMsg"></div>
</div>

<!-- مكتبات Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBoHjQBVK98JsbBFs5Ty-NTmAHKpz0jLhc",
        authDomain: "multischoolattendance.firebaseapp.com",
        projectId: "multischoolattendance",
        storageBucket: "multischoolattendance.firebasestorage.app",
        messagingSenderId: "539847508281",
        appId: "1:539847508281:web:13c73bf4260af3ecfb68e8",
        measurementId: "G-791M6F7WMC"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // الخطوة الأولى: التحقق من كود المدرسة وحالة كلمة المرور والموقع
    window.checkSchoolCode = async () => {
        const code = document.getElementById('schoolCodeInput').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        
        if (!code) {
            errorMsg.innerText = "يرجى إدخال كود المدرسة!";
            return;
        }

        errorMsg.style.color = "#007bff";
        errorMsg.innerText = "جاري التحقق من المدرسة...";

        try {
            const schoolRef = db.collection("schools").doc(code);
            const schoolSnap = await schoolRef.get();

            if (!schoolSnap.exists) {
                errorMsg.style.color = "red";
                errorMsg.innerText = "كود المدرسة غير صحيح أو غير موجود!";
                return;
            }

            const schoolData = schoolSnap.data();
            document.getElementById('verifiedSchoolCode').value = code;

            // التحقق أولاً من تثبيت الموقع الجغرافي (GPS) إذا لم يكن مثبتآً
            if (!schoolData.lat || !schoolData.lon || schoolData.lat === 0 || schoolData.lon === 0) {
                errorMsg.innerText = "جاري تثبيت موقع المدرسة عبر الـ GPS لأول مرة...";
                
                if (!navigator.geolocation) {
                    errorMsg.style.color = "red";
                    errorMsg.innerText = "متصفحك لا يدعم تحديد الموقع الجغرافي.";
                    return;
                }

                try {
                    const position = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 10000 });
                    });
                    
                    await schoolRef.update({ 
                        lat: position.coords.latitude, 
                        lon: position.coords.longitude 
                    });
                } catch (err) {
                    errorMsg.style.color = "red";
                    errorMsg.innerText = "يجب الموافقة على إذن الموقع الجغرافي (GPS) للمتابعة.";
                    return;
                }
            }

            // إخفاء حقل الكود وإظهار حقول كلمة المرور
            document.getElementById('stepCode').classList.add('hidden');
            document.getElementById('stepPassword').classList.remove('hidden');
            errorMsg.innerText = "";

            // فحص هل توجد كلمة مرور مسجلة مسبقاً في القاعدة؟
            if (!schoolData.password) {
                // المرة الأولى: إظهار مربعي الإنشاء والتأكيد
                document.getElementById('firstTimeFields').classList.remove('hidden');
                document.getElementById('instructionText').innerText = "قم بإنشاء كلمة مرور جديدة لمدير المدرسة";
            } else {
                // المرات اللاحقة: إظهار مربع واحد للدخول
                document.getElementById('normalLoginFields').classList.remove('hidden');
                document.getElementById('instructionText').innerText = "أدخل كلمة المرور الخاصة بلوحة التحكم";
            }

        } catch (e) {
            console.error(e);
            errorMsg.style.color = "red";
            errorMsg.innerText = "حدث خطأ في الاتصال بقاعدة البيانات.";
        }
    };

    // حفظ كلمة المرور للمرة الأولى وتأكيدها
    window.setupAndLogin = async () => {
        const code = document.getElementById('verifiedSchoolCode').value;
        const p1 = document.getElementById('newPassword').value.trim();
        const p2 = document.getElementById('confirmPassword').value.trim();
        const errorMsg = document.getElementById('errorMsg');

        if (!p1 || !p2) {
            errorMsg.style.color = "red";
            errorMsg.innerText = "يرجى تعيين كلمة المرور وتأكيدها!";
            return;
        }

        if (p1 !== p2) {
            errorMsg.style.color = "red";
            errorMsg.innerText = "كلمتا المرور غير متطابقتين!";
            return;
        }

        try {
            errorMsg.style.color = "#007bff";
            errorMsg.innerText = "جاري حفظ كلمة المرور والدخول...";

            await db.collection("schools").doc(code).update({ password: p1 });

            errorMsg.style.color = "green";
            errorMsg.innerText = "تم حفظ كلمة المرور بنجاح! جاري التوجيه...";
            
            setTimeout(() => {
                window.location.href = `dashboard.html?school=${code}&admin=true`;
            }, 1000);

        } catch (err) {
            console.error(err);
            errorMsg.style.color = "red";
            errorMsg.innerText = "فشل حفظ كلمة المرور في قاعدة البيانات.";
        }
    };

    // التحقق من كلمة المرور في المرات اللاحقة
    window.verifyPasswordAndLogin = async () => {
        const code = document.getElementById('verifiedSchoolCode').value;
        const enteredPass = document.getElementById('loginPassword').value.trim();
        const errorMsg = document.getElementById('errorMsg');

        if (!enteredPass) {
            errorMsg.style.color = "red";
            errorMsg.innerText = "يرجى إدخال كلمة المرور!";
            return;
        }

        try {
            const schoolSnap = await db.collection("schools").doc(code).get();
            const schoolData = schoolSnap.data();

            if (schoolData.password && schoolData.password === enteredPass) {
                errorMsg.style.color = "green";
                errorMsg.innerText = "كلمة المرور صحيحة! جاري الدخول...";
                setTimeout(() => {
                    window.location.href = `dashboard.html?school=${code}&admin=true`;
                }, 800);
            } else {
                errorMsg.style.color = "red";
                errorMsg.innerText = "كلمة المرور غير صحيحة، حاول مرة أخرى.";
            }

        } catch (err) {
            console.error(err);
            errorMsg.style.color = "red";
            errorMsg.innerText = "حدث خطأ أثناء التحقق من كلمة المرور.";
        }
    };
</script>
</body>
</html>
