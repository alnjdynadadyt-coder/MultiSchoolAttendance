<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة وإضافة المدارس - نظام الحضور الجغرافي</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #eef2f3; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #007bff; text-align: center; margin-bottom: 5px; }
        h3 { text-align: center; color: #555; margin-top: 0; font-size: 15px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .btn-action { display: block; width: 100%; padding: 14px; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 15px; text-align: center; }
        .btn-success { background: #28a745; }
        .btn-info { background: #17a2b8; margin-bottom: 10px; }
        .btn-back { background: #6c757d; margin-top: 20px; }
        #status { margin-top: 15px; padding: 12px; text-align: center; border-radius: 6px; font-weight: bold; font-size: 14px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>إدارة المدارس</h2>
    <h3>إضافة مدرسة جديدة وحدودها الجغرافية</h3>
    <hr style="margin: 20px 0; border:0; border-top:1px solid #eee;">

    <div class="form-group">
        <label>معرف المدرسة (ID إنجليزي بدون مسافات، مثال: school2):</label>
        <input type="text" id="schoolId" placeholder="school_id">
    </div>

    <div class="form-group">
        <label>اسم المدرسة الرسمي:</label>
        <input type="text" id="schoolName" placeholder="مثال: ثانوية الفراهيدي للبنين">
    </div>

    <button type="button" class="btn-action btn-info" onclick="getGPS()">📍 جلب إحداثيات موقعي الحالي (GPS)</button>

    <div class="form-group">
        <label>خط العرض (Lat):</label>
        <input type="number" id="lat" step="any" placeholder="0.0">
    </div>

    <div class="form-group">
        <label>خط الطول (Lng):</label>
        <input type="number" id="lng" step="any" placeholder="0.0">
    </div>

    <div class="form-group">
        <label>نصف القطر المسموح للتسجيل (بالمتر):</label>
        <input type="number" id="radius" value="100">
    </div>

    <button type="button" class="btn-action btn-success" id="saveSchoolBtn">💾 حفظ المدرسة في قاعدة البيانات</button>
    
    <div id="status"></div>

    <button type="button" class="btn-action btn-back" onclick="window.location.href='index.html'">⬅ العودة إلى لوحة التحكم الرئيسية</button>
</div>

<!-- دوال الجافاسكريبت المستقلة لضمان الاستجابة -->
<script>
    function getGPS() {
        const statusDiv = document.getElementById("status");
        statusDiv.className = "";
        statusDiv.textContent = "جاري طلب إحداثيات الموقع... يرجى السماح للمتصفح بالوصول للموقع.";

        if (!navigator.geolocation) {
            statusDiv.className = "error";
            statusDiv.textContent = "متصفحك لا يدعم تحديد الموقع الجغرافي.";
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (position) => {
                document.getElementById("lat").value = position.coords.latitude;
                document.getElementById("lng").value = position.coords.longitude;
                statusDiv.className = "success";
                statusDiv.textContent = "تم بنجاح جلب إحداثيات موقعك الحالي!";
            },
            (error) => {
                statusDiv.className = "error";
                let msg = "فشل الحصول على الموقع.";
                if (error.code === error.PERMISSION_DENIED) {
                    msg = "تم رفض إذن الوصول للموقع. يرجى تفعيله من إعدادات المتصفح/الجهاز.";
                } else if (error.code === error.POSITION_UNAVAILABLE) {
                    msg = "معلومات الموقع غير متوفرة حالياً.";
                } else if (error.code === error.TIMEOUT) {
                    msg = "ان انتهى الوقت المخصص لطلب الموقع.";
                }
                statusDiv.textContent = msg + " (يمكنك إدخال الإحداثيات يدوياً إذا لزم الأمر)";
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }
</script>

<!-- Firebase SDK & Logic -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBoHjQBVK98JsbBFs5Ty-NTmAHKpz0jLhc",
      authDomain: "multischoolattendance.firebaseapp.com",
      projectId: "multischoolattendance",
      storageBucket: "multischoolattendance.firebasestorage.app",
      messagingSenderId: "539847508281",
      appId: "1:539847508281:web:13c73bf4260af3ecfb68e8",
      measurementId: "G-791M6F7WMC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const statusDiv = document.getElementById("status");

    // زر حفظ المدرسة
    document.getElementById('saveSchoolBtn').addEventListener('click', async () => {
        const id = document.getElementById("schoolId").value.trim();
        const name = document.getElementById("schoolName").value.trim();
        const lat = parseFloat(document.getElementById("lat").value);
        const lng = parseFloat(document.getElementById("lng").value);
        const radius = parseFloat(document.getElementById("radius").value);

        if (!id || !name || isNaN(lat) || isNaN(lng)) {
            statusDiv.className = "error";
            statusDiv.textContent = "الرجاء تعبئة كافة الحقول المطلوبة بشكل صحيح!";
            return;
        }

        try {
            await setDoc(doc(db, "schools", id), {
                name: name,
                lat: lat,
                lng: lng,
                radius: radius
            });
            statusDiv.className = "success";
            statusDiv.textContent = "تم حفظ المدرسة بنجاح في النظام!";
            
            // تفريغ الحقول بعد الحفظ الناجح
            document.getElementById("schoolId").value = "";
            document.getElementById("schoolName").value = "";
            document.getElementById("lat").value = "";
            document.getElementById("lng").value = "";
        } catch (e) {
            statusDiv.className = "error";
            statusDiv.textContent = "حدث خطأ أثناء الحفظ: " + e.message;
        }
    });
</script>

</body>
</html>
