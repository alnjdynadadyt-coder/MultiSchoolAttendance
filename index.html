<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل دخول مدراء المدارس</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; text-align: center; }
        .btn { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #0056b3; }
        #errorMsg { color: red; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2 style="color: #333; margin-bottom: 10px;">بوابة دخول المدارس</h2>
    <p style="color: #666; font-size: 14px; margin-bottom: 20px;">أدخل كود المدرسة للتوجه إلى لوحة التحكم</p>
    
    <input type="text" id="schoolCodeInput" placeholder="أدخل كود المدرسة (مثل: n1)">
    <button class="btn" onclick="loginToSchool()">دخول لوحة التحكم</button>
    <div id="errorMsg"></div>
</div>

<!-- مكتبات Firebase (نسخة Compat لتتطابق مع صفحة الأدمن) -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBoHjQBVK98JsbBFs5Ty-NTmAHKpz0jLhc",
        authDomain: "multischoolattendance.firebaseapp.com",
        projectId: "multischoolattendance",
        storageBucket: "multischoolattendance.firebasestorage.app",
        messagingSenderId: "539847508281",
        appId: "1:539847508281:web:13c73bf4260af3ecfb68e8",
        measurementId: "G-791M6F7WMC"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    window.loginToSchool = async () => {
        const code = document.getElementById('schoolCodeInput').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        
        if (!code) {
            errorMsg.innerText = "يرجى إدخال كود المدرسة!";
            return;
        }

        errorMsg.style.color = "#007bff";
        errorMsg.innerText = "جاري التحقق من المدرسة...";

        try {
            const schoolRef = db.collection("schools").doc(code);
            const schoolSnap = await schoolRef.get();

            if (!schoolSnap.exists) {
                errorMsg.style.color = "red";
                errorMsg.innerText = "كود المدرسة غير صحيح أو غير موجود!";
                return;
            }

            const schoolData = schoolSnap.data();

            // فحص هل الموقع الجغرافي مثبت مسبقاً؟ (بفحص lat و lon)
            if (!schoolData.lat || !schoolData.lon || schoolData.lat === 0 || schoolData.lon === 0) {
                errorMsg.innerText = "يرجى السماح بتحديد الموقع الجغرافي (GPS) لتثبيت موقع المدرسة لأول مرة...";
                
                if (!navigator.geolocation) {
                    errorMsg.style.color = "red";
                    errorMsg.innerText = "متصفحك لا يدعم تحديد الموقع الجغرافي.";
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        try {
                            const lat = position.coords.latitude;
                            const lon = position.coords.longitude;

                            // حفظ الإحداثيات مباشرة في صفحة الأدمن وقاعدة البيانات بنفس تسمية حقل lon
                            await schoolRef.update({ lat: lat, lon: lon });

                            errorMsg.style.color = "green";
                            errorMsg.innerText = "تم تثبيت موقع المدرسة بنجاح! جاري الدخول...";
                            
                            setTimeout(() => {
                                window.location.href = `dashboard.html?school=${code}`;
                            }, 1000);
                        } catch (err) {
                            console.error(err);
                            errorMsg.style.color = "red";
                            errorMsg.innerText = "فشل حفظ الإحداثيات في قاعدة البيانات.";
                        }
                    },
                    (error) => {
                        errorMsg.style.color = "red";
                        errorMsg.innerText = "يجب الموافقة على إذن الموقع الجغرافي (GPS) لمرة واحدة لدخول لوحة التحكم.";
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                // إذا كانت الإحداثيات مسجلة مسبقاً، الدخول المباشر إلى لوحة التحكم
                window.location.href = `dashboard.html?school=${code}`;
            }

        } catch (e) {
            console.error(e);
            errorMsg.style.color = "red";
            errorMsg.innerText = "حدث خطأ في الاتصال بقاعدة البيانات.";
        }
    };
</script>
</body>
</html>
