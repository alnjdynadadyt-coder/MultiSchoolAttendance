<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title id="pageTitle">التسجيل اليدوي - لوحة الإدارة</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #eef2f3; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; background: #f8f9fa; padding: 15px; border-radius: 8px; align-items: center; }
        input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 5px; cursor: pointer; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: auto; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #007bff; color: white; }
        
        th:nth-child(1), td:nth-child(1) { width: 20%; min-width: 110px; font-weight: bold; }
        th:nth-child(8), td:nth-child(8) { width: 100px; }
        td:nth-child(5) input[type="time"] { width: 85px; padding: 5px; font-size: 13px; text-align: center; }

        .btn-del { background: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 3px; cursor: pointer; font-weight: bold; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #007bff; text-decoration: none; font-weight: bold; font-size: 16px; background: #e7f1ff; padding: 8px 15px; border-radius: 5px; border: 1px solid #b8daff; }
        .back-link:hover { background: #d0e1fd; }
    </style>
    <!-- استدعاء الملف المركزي للقواعد -->
    <script src="attendance-rules.js"></script>
</head>
<body>

<div class="container">
    <a id="backLink" href="dashboard.html" class="back-link">← العودة لوحة التحكم</a>
    <h2 id="mainHeading" style="color:#007bff; text-align:center;">📝 التسجيل اليدوي المفصل للحضور</h2>
    
    <div class="input-group">
        <input type="date" id="dateSelector" onchange="renderTable()">
        <input type="text" id="empCode" placeholder="كود الموظف">
        <select id="status">
            <option>حاضر</option>
            <option>متأخر</option>
            <option>مجاز</option>
            <option>غائب</option>
        </select>
        <input type="time" id="customTime">
        <input type="text" id="reason" placeholder="سبب الغياب أو الملاحظة">
        <button id="actionBtn" onclick="saveAttendance()" style="background:#007bff; color:white; font-weight:bold;">تسجيل يدوي</button>
    </div>

    <table>
        <thead>
            <tr><th>الاسم</th><th>اليوم</th><th>التاريخ</th><th>الحضور</th><th>الانصراف</th><th>الحالة</th><th>السبب</th><th>إجراء</th></tr>
        </thead>
        <tbody id="attendanceTable"></tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, doc, getDoc, addDoc, setDoc, deleteDoc, query, where, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const db = getFirestore(initializeApp({
        apiKey: "AIzaSyBoHjQBVK98JsbBFs5Ty-NTmAHKpz0jLhc",
        authDomain: "multischoolattendance.firebaseapp.com",
        projectId: "multischoolattendance",
        storageBucket: "multischoolattendance.firebasestorage.app",
        messagingSenderId: "539847508281",
        appId: "1:539847508281:web:13c73bf4260af3ecfb68e8",
        measurementId: "G-791M6F7WMC"
    }));

    const urlParams = new URLSearchParams(window.location.search);
    let schoolId = urlParams.get('school');
    const isAdmin = urlParams.get('admin') === 'true';

    if (!schoolId) {
        schoolId = localStorage.getItem("currentSchoolId");
    }

    let schoolShiftType = "morning_only"; // القيمة الافتراضية

    if (!schoolId) {
        alert("لم يتم تحديد المدرسة! سيتم توجيهك للصفحة الرئيسية.");
        window.location.href = "index.html";
    } else {
        localStorage.setItem("currentSchoolId", schoolId);
        
        let backUrl = `dashboard.html?school=${schoolId}`;
        if (isAdmin) {
            backUrl += `&admin=true`;
        }
        document.getElementById('backLink').href = backUrl;

        // جلب اسم المدرسة ونوع الدوام وتحديث الترويسة
        getDoc(doc(db, "schools", schoolId)).then((schoolDoc) => {
            if (schoolDoc.exists()) {
                const data = schoolDoc.data();
                const schoolName = data.name;
                schoolShiftType = data.shiftType || "morning_only";
                document.getElementById('pageTitle').innerText = `التسجيل اليدوي - ${schoolName}`;
                document.getElementById('mainHeading').innerText = `📝 التسجيل اليدوي المفصل - ${schoolName}`;
            }
        });
    }

    const nowObj = new Date();
    const baghdadDate = nowObj.toLocaleDateString('en-CA', { timeZone: 'Asia/Baghdad' });
    const baghdadTime = nowObj.toLocaleTimeString('en-US', { hour: '2-digit', minute:'2-digit', hour12: false, timeZone: 'Asia/Baghdad' });

    document.getElementById('dateSelector').value = baghdadDate;
    document.getElementById('customTime').value = baghdadTime;

    window.renderTable = () => {
        const date = document.getElementById('dateSelector').value;
        const attendanceRef = collection(db, "schools", schoolId, "attendance");
        onSnapshot(query(attendanceRef, where("date", "==", date)), snap => {
            let rows = "";
            snap.forEach(d => {
                let data = d.data();
                rows += `<tr>
                    <td>${data.name}</td>
                    <td>${data.day}</td>
                    <td>${data.date}</td>
                    <td>${data.time}</td>
                    <td><input type="time" onchange="updateExitTime('${d.id}', this.value)" value="${data.exitTime || ''}"></td>
                    <td>${data.status}</td>
                    <td>${data.reason || ''}</td>
                    <td>
                        <button class="btn-del" onclick="deleteAtt('${d.id}')">حذف</button>
                    </td>
                </tr>`;
            });
            document.getElementById('attendanceTable').innerHTML = rows;
        });
    };

    window.updateExitTime = async (id, time) => { 
        await setDoc(doc(db, "schools", schoolId, "attendance", id), { exitTime: time }, { merge: true }); 
    };

    window.saveAttendance = async () => {
        try {
            const code = document.getElementById('empCode').value.trim();
            const date = document.getElementById('dateSelector').value;
            const statusRaw = document.getElementById('status').value;
            const timeInput = document.getElementById('customTime').value;
            const reason = document.getElementById('reason').value;

            if(!code) { alert("يرجى إدخال كود الموظف"); return; }

            const empSnap = await getDoc(doc(db, "schools", schoolId, "employees", code));
            if (!empSnap.exists()) { alert("الكود (" + code + ") غير موجود في قائمة موظفي هذه المدرسة!"); return; }
            
            const empData = empSnap.data();
            let status = statusRaw;
            
            if (status === "حاضر" || status === "متأخر") {
                // استخدام محرك القواعد المركزي لتحديد الحالة بناءً على نوع الدوام والفئة والوقت
                const evaluation = evaluateAttendanceRules(schoolShiftType, empData.type, 'attendance', timeInput);
                status = evaluation.status || "حاضر";
            }

            const attendanceRef = collection(db, "schools", schoolId, "attendance");

            const q = query(attendanceRef, where("empCode", "==", code), where("date", "==", date));
            const existingDocs = await getDocs(q);
            
            if (!existingDocs.empty) { 
                alert("الموظف مسجل بالفعل لهذا اليوم! يجدر بك حذف السجل القديم أولاً إذا أردت إعادة تسجيله بوقت مختلف."); 
                return; 
            }
            
            const targetDateObj = new Date(date);
            const formattedDayName = targetDateObj.toLocaleDateString('ar-EG', {weekday: 'long', timeZone: 'Asia/Baghdad'});

            await addDoc(attendanceRef, { 
                empCode: code, 
                name: empData.name, 
                status, 
                time: (status === "غائب" || status === "مجاز") ? "-" : timeInput, 
                exitTime: "", 
                date, 
                day: formattedDayName, 
                reason: reason,
                leaveImage: ""
            });
            
            alert("تم التسجيل بنجاح كـ: " + status);
            document.getElementById('empCode').value = '';
            document.getElementById('reason').value = '';

        } catch (error) {
            console.error("خطأ في حفظ البيانات:", error);
            alert("حدث خطأ أثناء الحفظ، تحقق من وحدة التحكم (Console)");
        }
    };

    window.deleteAtt = (id) => {
        if(confirm("هل أنت متأكد من حذف هذا السجل؟ (سيُتيح لك ذلك إعادة تسجيل الموظف من جديد)")) {
            deleteDoc(doc(db, "schools", schoolId, "attendance", id));
        }
    };

    renderTable();
</script>
</body>
</html>
