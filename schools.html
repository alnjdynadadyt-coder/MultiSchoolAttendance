<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المدارس - نظام الحضور الجغرافي</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #eef2f3; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 750px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #007bff; text-align: center; margin-bottom: 5px; }
        h3 { text-align: center; color: #555; margin-top: 0; font-size: 15px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .btn-action { display: block; width: 100%; padding: 14px; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 15px; text-align: center; }
        .btn-success { background: #28a745; }
        .btn-info { background: #17a2b8; margin-bottom: 10px; }
        .btn-back { background: #6c757d; margin-top: 20px; text-decoration: none; }
        
        /* تنسيق جدول عرض المدارس */
        .schools-table { width: 100%; margin-top: 30px; border-collapse: collapse; text-align: right; }
        .schools-table th, .schools-table td { padding: 12px; border-bottom: 1px solid #ddd; font-size: 14px; }
        .schools-table th { background: #f8f9fa; color: #333; }
        .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 4px; border: none; cursor: pointer; color: white; margin-left: 5px; }
        .btn-edit { background: #ffc107; color: #212529; }
        .btn-delete { background: #dc3545; }

        #status { margin-top: 15px; padding: 12px; text-align: center; border-radius: 6px; font-weight: bold; font-size: 14px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏫 إدارة المدارس</h2>
    <h3>إضافة، تعديل، وعرض المدارس في النظام</h3>
    <hr style="margin: 20px 0; border:0; border-top:1px solid #eee;">

    <!-- حقل مخفي لتخزين معرف المدرسة عند التعديل -->
    <input type="hidden" id="editingSchoolId" value="">

    <div class="form-group">
        <label>اسم المدرسة الرسمي:</label>
        <input type="text" id="schoolName" placeholder="مثال: متوسطة الفراهيدي">
    </div>

    <button type="button" class="btn-action btn-info" onclick="getGPS()">📍 جلب إحداثيات موقعي الحالي (GPS)</button>

    <div class="form-group">
        <label>خط العرض (Lat):</label>
        <input type="number" id="lat" step="any" placeholder="0.0">
    </div>

    <div class="form-group">
        <label>خط الطول (Lng):</label>
        <input type="number" id="lng" step="any" placeholder="0.0">
    </div>

    <button type="button" class="btn-action btn-success" id="saveUpdateBtn" onclick="saveOrUpdateSchool()">💾 حفظ المدرسة في قاعدة البيانات</button>
    
    <div id="status"></div>

    <!-- قسم عرض المدارس -->
    <h3 style="margin-top: 40px; text-align: right; border-bottom: 2px solid #007bff; padding-bottom: 8px;">📋 قائمة المدارس المسجلة</h3>
    <div style="overflow-x: auto;">
        <table class="schools-table">
            <thead>
                <tr>
                    <th>اسم المدرسة</th>
                    <th>الإحداثيات (Lat, Lng)</th>
                    <th>التحكم</th>
                </tr>
            </thead>
            <tbody id="schoolsTableBody">
                <tr><td colspan="3" style="text-align: center; color: #777;">جاري تحميل المدارس...</td></tr>
            </tbody>
        </table>
    </div>

    <a href="index.html" class="btn-action btn-back">⬅ العودة إلى لوحة التحكم الرئيسية</a>
</div>

<!-- جافاسكريفت للتحكم والربط بقاعدة البيانات -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBoHjQBVK98JsbBFs5Ty-NTmAHKpz0jLhc",
      authDomain: "multischoolattendance.firebaseapp.com",
      projectId: "multischoolattendance",
      storageBucket: "multischoolattendance.firebasestorage.app",
      messagingSenderId: "539847508281",
      appId: "1:539847508281:web:13c73bf4260af3ecfb68e8",
      measurementId: "G-791M6F7WMC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // دالة جلب الـ GPS (عالمية لتستجيب للأزرار)
    window.getGPS = function() {
        const statusDiv = document.getElementById("status");
        statusDiv.className = "";
        statusDiv.textContent = "جاري طلب إحداثيات الموقع...";

        if (!navigator.geolocation) {
            statusDiv.className = "error";
            statusDiv.textContent = "متصفحك لا يدعم تحديد الموقع الجغرافي.";
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (position) => {
                document.getElementById("lat").value = position.coords.latitude;
                document.getElementById("lng").value = position.coords.longitude;
                statusDiv.className = "success";
                statusDiv.textContent = "✔ تم بنجاح جلب إحداثيات موقعك الحالي!";
            },
            (error) => {
                statusDiv.className = "error";
                statusDiv.textContent = "⚠ تعذر جلب الموقع تلقائياً. يمكنك إدخاله يدوياً.";
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    };

    // دالة جلب وعرض المدارس في الجدول
    async function loadSchools() {
        const tbody = document.getElementById("schoolsTableBody");
        try {
            const querySnapshot = await getDocs(collection(db, "schools"));
            tbody.innerHTML = "";
            
            if (querySnapshot.empty) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #777;">لا توجد مدارس مسجلة حتى الآن.</td></tr>';
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const school = docSnap.data();
                const schoolId = docSnap.id;
                
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><strong>${school.name}</strong></td>
                    <td style="font-size: 12px; color: #555;">${school.lat.toFixed(4)}, ${school.lng.toFixed(4)}</td>
                    <td>
                        <button class="btn-sm btn-edit" onclick="prepareEdit('${schoolId}', '${school.name}', ${school.lat}, ${school.lng})">✏ تعديل</button>
                        <button class="btn-sm btn-delete" onclick="deleteSchool('${schoolId}')">🗑 حذف</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            console.error("Error loading schools: ", e);
            tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: red;">خطأ في تحميل المدارس.</td></tr>';
        }
    }

    // دالة الحفظ أو التعديل
    window.saveOrUpdateSchool = async function() {
        const statusDiv = document.getElementById("status");
        statusDiv.className = "";
        statusDiv.textContent = "جاري المعالجة...";

        const editingId = document.getElementById("editingSchoolId").value;
        const name = document.getElementById("schoolName").value.trim();
        const lat = parseFloat(document.getElementById("lat").value);
        const lng = parseFloat(document.getElementById("lng").value);
        const fixedRadius = 100;

        if (!name || isNaN(lat) || isNaN(lng)) {
            statusDiv.className = "error";
            statusDiv.textContent = "الرجاء إدخال اسم المدرسة والتأكد من إحداثيات الموقع!";
            return;
        }

        try {
            if (editingId) {
                // عملية تعديل مدرسة موجودة
                await updateDoc(doc(db, "schools", editingId), {
                    name: name,
                    lat: lat,
                    lng: lng,
                    radius: fixedRadius
                });
                statusDiv.className = "success";
                statusDiv.textContent = "✔ تم تعديل بيانات المدرسة بنجاح!";
                document.getElementById("editingSchoolId").value = "";
                document.getElementById("saveUpdateBtn").textContent = "💾 حفظ المدرسة في قاعدة البيانات";
                document.getElementById("saveUpdateBtn").style.background = "#28a745";
            } else {
                // عملية إضافة مدرسة جديدة
                await addDoc(collection(db, "schools"), {
                    name: name,
                    lat: lat,
                    lng: lng,
                    radius: fixedRadius,
                    createdAt: new Date().toISOString()
                });
                statusDiv.className = "success";
                statusDiv.textContent = "🎉 تم حفظ المدرسة (" + name + ") بنجاح!";
            }

            // تفريغ الحقول وإعادة تحميل الجدول
            document.getElementById("schoolName").value = "";
            document.getElementById("lat").value = "";
            document.getElementById("lng").value = "";
            loadSchools();
        } catch (e) {
            statusDiv.className = "error";
            statusDiv.textContent = "❌ حدث خطأ: " + e.message;
            console.error(e);
        }
    };

    // تجهيز حقول النموذج لتعديل مدرسة
    window.prepareEdit = function(id, name, lat, lng) {
        document.getElementById("editingSchoolId").value = id;
        document.getElementById("schoolName").value = name;
        document.getElementById("lat").value = lat;
        document.getElementById("lng").value = lng;
        
        const btn = document.getElementById("saveUpdateBtn");
        btn.textContent = "🔄 تحديث بيانات المدرسة";
        btn.style.background = "#ffc107";
        btn.style.color = "#212529";
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // حذف مدرسة
    window.deleteSchool = async function(id) {
        if (!confirm("هل أنت متأكد من حذف هذه المدرسة نهائياً؟")) return;
        
        try {
            await deleteDoc(doc(db, "schools", id));
            loadSchools();
            const statusDiv = document.getElementById("status");
            statusDiv.className = "success";
            statusDiv.textContent = "🗑 تم حذف المدرسة بنجاح.";
        } catch (e) {
            alert("خطأ أثناء الحذف: " + e.message);
        }
    };

    // تحميل القائمة أول ما تفتح الصفحة
    loadSchools();
</script>

</body>
</html>
